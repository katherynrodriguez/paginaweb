<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Reconocete </title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #fff;
      color: #000;
    }
    .navbar {
      background-color: #F0CCD9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }
    .logo {
      font-size: 1.5em;
      font-weight: bold;
      color: #966586;
    }
    .cart {
      font-size: 1.2em;
      color: #000;
    }
    .categorias {
      text-align: center;
      padding: 30px 20px;
    }
    .categoria-item {
      display: inline-block;
      margin: 10px;
      text-align: center;
    }
    .categoria-item img {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      object-fit: cover;
    }
    .swiper {
      width: 100%;
      height: 300px;
      margin: 20px 0;
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }
    footer {
      background-color: #F0CCD9;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
    }
    .contacto a {
      margin: 0 10px;
      color: #000;
    }
  </style>
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="logo"> Reconocete </div>
    <div class="cart" id="cart">
      🛒<span id="cart-count">0</span>
    </div>
  </nav>

  <!-- Carusel de imágenes -->
  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="img/banner1.jpg" alt="Banner 1"></div>
      <div class="swiper-slide"><img src="img/banner2.jpg" alt="Banner 2"></div>
      <div class="swiper-slide"><img src="img/banner3.jpg" alt="Banner 3"></div>
    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <!-- Categorías con imagen -->
  <section id="categorias" class="categorias">
    <h2>Categorías</h2>
    <div class="categoria-item">
      <img src="img/shots.jpg" alt="Shots">
      <p>Shots</p>
    </div>
    <div class="categoria-item">
      <img src="shots color.jpeg" alt="Shots Color">
      <p>Shots Color </p>
    </div>
    <div class="categoria-item">
      <img src="img/shots.jpg" alt="Shots Full Color ">
      <p>Shots Full Color </p>
    </div>
    <div class="categoria-item">
      <img src="mug tradicional .jpeg" alt="Mugs">
      <p>Mugs</p>
    </div>
    <div class="categoria-item">
      <img src="img/llaveros.jpg" alt="Llaveros">
      <p>Llaveros</p>
    </div>
    <div class="categoria-item">
      <img src="img/llaveros.jpg" alt="Vasos Tipo lata">
      <p>Vasos tipo lata</p>
    </div>
  </section>

  <!-- Productos -->
  <section id="productos"></section>

  <!-- Carrito -->
  <section id="carrito">
    <h2>Tu carrito</h2>
    <ul id="carrito-lista"></ul>
  </section>

  <!-- Botón flotante WhatsApp -->
  <a href="https://wa.me/573001234567" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width:48px;height:48px;">
  </a>

  <!-- Contacto en pie de página -->
  <footer>
    <div class="contacto">
      <p>Síguenos:</p>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <p>Correo: reconoceteatumanera@gmail.com</p>
      <p>Teléfono: +57 3236683644</p>
    </div>
    <p>&copy; 2025 Recuérdame. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      loop: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
    });
  </script>
</body>
</html>
