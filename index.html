<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Recuérdame</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="logo">Recuérdame</div>
    <div class="cart" id="cart">
      🛒<span id="cart-count">0</span>
    </div>
  </nav>

  <!-- Categorías con imagen -->
  <section id="categorias" class="categorias">
    <h2>Categorías</h2>
    <div class="categoria-item">
      <img src="img/shots.jpg" alt="Shots">
      <p>Shots</p>
    </div>
    <div class="categoria-item">
      <img src="img/mugs.jpg" alt="Mugs">
      <p>Mugs</p>
    </div>
    <div class="categoria-item">
      <img src="img/llaveros.jpg" alt="Llaveros">
      <p>Llaveros</p>
    </div>
  </section>

  <!-- Productos -->
  <section id="productos"></section>

  <!-- Carrito -->
  <section id="carrito">
    <h2>Tu carrito</h2>
    <ul id="carrito-lista"></ul>
  </section>

  <!-- Botón flotante WhatsApp -->
  <a href="https://wa.me/573001234567" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width:48px;height:48px;">
  </a>

  <!-- Contacto en pie de página -->
  <footer>
    <div class="contacto">
      <p>Síguenos:</p>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <p>Correo: contacto@recuerdame.com</p>
      <p>Teléfono: +57 300 123 4567</p>
    </div>
    <p>&copy; 2025 Recuérdame. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
