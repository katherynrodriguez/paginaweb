<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Representate</title>
    <link rel="stylesheet" href="buddy.css">
    <link rel="shortcut icon" href="logo arregladorepresentate.png">
    <style>
            /* Estilos generales */
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Estilos del menú */
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f0ccd9;
            color: #966586;
            padding: 15px 20px;
            text-align: center;
            font-size: 18px;
        }

        /* Estilos del contenido */
        .contenido {
            margin-top: 60px; /* Para evitar que el contenido quede debajo del menú */
            padding: 20px;
            text-align: center;
            min-height: 70vh; /* Para mantener un buen espacio en la pantalla */
        }

        /* Estilos del footer */
        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 20px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
    </style>
</head>
<body>
    
    <!-- Menú fijo -->
    <div class="menu">
        <b>Mi Menú</b> | Inicio | Servicios | Contacto
    </div>

    <!-- Contenido Principal -->
    <div class="contenido">
        <h1>Categorias </h1>
        <p>Este es un diseño con menú fijo, contenido central y footer.</p>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2025 Todos los derechos reservados
    </div>
    
</body>
</html>
