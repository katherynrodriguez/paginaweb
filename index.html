<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Representate</title>
    <link rel="stylesheet" href="buddy.css">
    <link rel="shortcut icon" href="logo arregladorepresentate.png">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Playfair, sans-serif;
        }

        body {
            background-color: #f8f8f8;
        }

        /* Encabezado */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 20px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            
        }

        
        .carrito {
            position: fixed;
            left: 10px;
            top: 100px;
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 4px 8px #966586;
            (0, 0, 0, 0.1);
            font-size: 16px;
        }

        
        .buscar-btn {
            background-color: #ffffff;
            color: #966586;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .buscar-btn:hover {
            background-color: #ffffff;
        }

        /* Contenido principal */
        .contenido {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
        }
            /* Estilos generales */
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Estilos del menú */
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f0ccd9;
            color: #966586;
            padding: 15px 20px;
            text-align: center;
            font-size: 18px;
        }

        /* Estilos del contenido */
        .contenido {
            margin-top: 60px; /* Para evitar que el contenido quede debajo del menú */
            padding: 20px;
            text-align: center;
            min-height: 70vh; /* Para mantener un buen espacio en la pantalla */
        }

        /* Estilos del footer */
        .footer {
            background-color: #966586;
            color: white;
            text-align: center;
            padding: 15px 20px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
    </style>
</head>
<body>
       <!-- Encabezado -->
    <div class="header">
        <div class="logo"></div>
        <button class="buscar-btn">¿Qué estás buscando?</button>
    </div>

    <!-- Carrito de compras -->
    <div class="carrito">
        🛒  (0)
    </div>

    <!-- Contenido principal -->
    < <div class="contenido">
        <h1>Inicio   Productos    Contacto    Preguntas Frecuentes    Instagram </h1>
        <p> MAS VENDIDOS</p>
    </div>
      
      <!-- Menú fijo -->
    <div class="menu">
        Inicio   Productos    Contacto    Preguntas Frecuentes    Instagram
    </div>

  
   

    <!-- Footer -->
    <div class="footer">
        Representate
    </div>  }
      }
      
    
    
</body>
</html>
